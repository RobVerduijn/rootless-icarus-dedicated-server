services:
  icarus:
    container_name: icarus-dedicated-server
    image: registry.example.com:9999/library/icarus-dedicated-server:1.20
    pull_policy: always
    restart: "unless-stopped"
    ports:
      - 17777:17777/udp
      - 27015:27015/udp
    volumes:
      - /home/steam/game:/home/steam/icarus-server:Z
    environment:
      - SESSIONNAME=MY ICARUS SERVER
      - SHUTDOWNNOTJOINEDFOR=40
      - SHUTDOWNEMPTYFOR=30
      - JOINPASSWORD=mysecret
      - ADMINPASSWORD=mysecret2
      - ALLOWNONADMINSLAUNCH=true
      - PORT=17777
      - QUERYPORT=27015
